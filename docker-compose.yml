services:
  db:
    image: mysql:8.0
    container_name: almarte-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-almarte}
      MYSQL_USER: ${MYSQL_USER:-almarte_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-almarte_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
